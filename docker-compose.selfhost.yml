name: opencodex-selfhost

services:
  opencodex:
    build:
      context: .
      secrets:
        - npmrc
    ports:
      - '${OPENCODEX_PORT:-8787}:8787'
    env_file:
      - .selfhost/opencodex.env
    volumes:
      - opencodex-data:/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  activepieces-app:
    image: ghcr.io/activepieces/activepieces:${AP_VERSION:-0.88.3}
    restart: unless-stopped
    ports:
      - '${ACTIVEPIECES_PORT:-8080}:80'
    env_file:
      - .selfhost/activepieces.env
    environment:
      AP_CONTAINER_TYPE: APP
    volumes:
      - activepieces-cache:/usr/src/app/cache
    depends_on:
      - activepieces-postgres
      - activepieces-redis

  activepieces-worker:
    image: ghcr.io/activepieces/activepieces:${AP_VERSION:-0.88.3}
    restart: unless-stopped
    env_file:
      - .selfhost/activepieces.env
    environment:
      AP_CONTAINER_TYPE: WORKER
      AP_FRONTEND_URL: http://activepieces-app
    volumes:
      - activepieces-cache:/usr/src/app/cache
    depends_on:
      - activepieces-app

  activepieces-postgres:
    image: pgvector/pgvector:0.8.0-pg14
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AP_POSTGRES_DATABASE:-activepieces}
      POSTGRES_USER: ${AP_POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
    volumes:
      - activepieces-postgres-data:/var/lib/postgresql/data

  activepieces-redis:
    image: redis:7.0.7
    restart: unless-stopped
    volumes:
      - activepieces-redis-data:/data

volumes:
  opencodex-data:
    name: opencodex-data
  activepieces-postgres-data:
    name: opencodex-activepieces-postgres
  activepieces-redis-data:
    name: opencodex-activepieces-redis
  activepieces-cache:
    name: opencodex-activepieces-cache

secrets:
  npmrc:
    file: ${NPMRC_PATH:-.npmrc.docker}
